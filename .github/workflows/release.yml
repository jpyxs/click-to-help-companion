name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update popup.html footer version
        run: |
          sed -i 's|<span class="footer-version">v[^<]*</span>|<span class="footer-version">v${{ steps.version.outputs.version }}</span>|' popup.html

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add popup.html
          git diff --staged --quiet || git commit -m "chore: bump version to v${{ steps.version.outputs.version }}"
          git push origin main

      - name: Build extension zip
        run: |
          zip -r click-to-help-companion-v${{ steps.version.outputs.version }}.zip . \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".agents/*" \
            --exclude ".codex/*" \
            --exclude ".gitattributes" \
            --exclude "README.md" \
            --exclude "CONTRIBUTING.md" \
            --exclude "LICENSE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: click-to-help-companion-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
