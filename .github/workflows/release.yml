name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Stamp CHANGELOG — rename [Unreleased] to this version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date +%Y-%m-%d)
          # Replace the [Unreleased] heading with the versioned heading
          sed -i "s/^## \[Unreleased\]/## [$VERSION] - $DATE/" CHANGELOG.md
          # Insert a fresh [Unreleased] section above the new versioned heading
          sed -i "s/^## \[$VERSION\] - $DATE/## [Unreleased]\n\n\n\n---\n\n## [$VERSION] - $DATE/" CHANGELOG.md

      - name: Extract changelog section for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BODY=$(node -e "
            const fs = require('fs');
            const content = fs.readFileSync('CHANGELOG.md', 'utf8');
            const version = process.argv[1];
            const lines = content.split('\n');
            let found = false;
            let result = [];
            for (const line of lines) {
              if (line.startsWith('## [' + version + ']')) {
                found = true;
                continue;
              }
              if (found && line.startsWith('## [')) break;
              if (found) result.push(line);
            }
            console.log(result.join('\n').trim());
          " "$VERSION")
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Update popup.html footer version
        run: |
          sed -i 's|<span class="footer-version">v[^<]*</span>|<span class="footer-version">v${{ steps.version.outputs.version }}</span>|' popup.html

      - name: Commit release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md popup.html
          git diff --staged --quiet || git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git push origin main

      - name: Build extension zip
        run: |
          zip -r click-to-help-companion-v${{ steps.version.outputs.version }}.zip \
            manifest.json \
            background.js \
            content.js \
            popup.html \
            popup.css \
            popup.js \
            shared.js \
            icons/ \
            fonts/*.ttf

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: click-to-help-companion-v${{ steps.version.outputs.version }}.zip
